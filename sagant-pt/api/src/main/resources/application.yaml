
spring:
  application:
    name: sagant-notifications-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sagant}
    username: ${SPRING_DATASOURCE_USERNAME:sagant}
    password: ${SPRING_DATASOURCE_PASSWORD:sagant_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Sagant Notification API
    version: 0.0.1
