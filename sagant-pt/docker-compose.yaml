
services:
  postgres:
    image: postgres:17
    container_name: sagant-postgres
    environment:
      POSTGRES_DB: sagant
      POSTGRES_USER: sagant
      POSTGRES_PASSWORD: sagant_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagant -d sagant"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: sagant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${EMAIL_PG_ADMIN:?Defini EMAIL_PG_ADMIN en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PWD_PG_ADMIN:?Defini PWD_PG_ADMIN en .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sagant-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sagant
      SPRING_DATASOURCE_USERNAME: ${USER_POSTGRE_API_DB:?Defini USER_POSTGRE_API_DB en .env}
      SPRING_DATASOURCE_PASSWORD: ${PWD_POSTGRE_API_DB:?Defini PWD_POSTGRE_API_DB en .env}
      SERVER_PORT: 8080
      SAGANT_SECURITY_ISSUER_URI: http://localhost:8180/realms/Sagant
      SAGANT_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/Sagant/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sagant-worker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sagant
      SPRING_DATASOURCE_USERNAME: ${USER_POSTGRE_API_DB:?Defini USER_POSTGRE_API_DB en .env}
      SPRING_DATASOURCE_PASSWORD: ${PWD_POSTGRE_API_DB:?Defini PWD_POSTGRE_API_DB en .env}
      SERVER_PORT: 8081
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://service-mock:8090/notifications}
    ports:
      -  "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      service-mock:
        condition: service_started

  service-mock:
    image: python:3.12-slim
    container_name: sagant-service-mock
    working_dir: /app
    volumes:
      - ./service-mock:/app:ro
    command: [ "python", "-u", "server.py" ]
    ports:
      - "8090:8090"


  keycloak-db:
    image: postgres:17
    container_name: sagant-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defini KEYCLOAK_DB_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: sagant-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Defini KEYCLOAK_ADMIN_USERNAME en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defini KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defini KEYCLOAK_DB_PASSWORD en .env}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy



volumes:
  postgres_data:
  pgadmin_data:
  keycloak_data:
