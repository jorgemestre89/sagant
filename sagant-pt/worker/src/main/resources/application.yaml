
spring:
  application:
    name: sagant-notifications-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sagant}
    username: ${SPRING_DATASOURCE_USERNAME:sagant}
    password: ${SPRING_DATASOURCE_PASSWORD:sagant_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Sagant Notification Worker
    version: 0.0.1

notifications:
  dispatch:
    service-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8090/notifications}

  processing:
    timeout: PT5M
    max-attempts: 3
    retry-delay: PT10S
    interval: PT2S
    recovery-interval: PT1M
    scheduler-enabled: true
