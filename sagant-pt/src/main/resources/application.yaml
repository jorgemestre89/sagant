spring:
  application:
    name: sagant-pt

  datasource:
    url: jdbc:postgresql://localhost:5432/sagant
    username: sagant
    password: sagant_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Sagant Notification Service
    version: 0.0.1

notifications:
  dispatch:
    service-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8090/notifications} #URL de la API que proc la notificacion enviada
  processing:
    timeout: PT5M   #declarar en formato Duration el timeout utilizado para recuperar las notificaciones antiguas en PROCESSING
    max-attempts: 3 #máximo de tres intentos de envío en total
    retry-delay: PT10S #espera inicial de 10 segundos antes de reintentar