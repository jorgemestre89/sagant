spring:
  application:
    name: sagant-pt

  datasource:
    url: jdbc:postgresql://localhost:5432/sagant
    username: sagant
    password: sagant_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Sagant Notification Service
    version: 0.0.1

notifications:
  dispatch:
    service-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8090/notifications}